name: Release

# A release pull request is opened or updated only when this workflow is run by
# hand from the Actions tab. A push to main only publishes the tag and the
# GitHub release of a release pull request that has just been merged.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Require the release token secret
        if: github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.GH_CI_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::The secret GH_CI_TOKEN is not set"; exit 1; }

      - uses: googleapis/release-please-action@v5
        with:
          # The release pull request is opened with the personal token: one
          # opened with the default GITHUB_TOKEN starts no workflow runs. The
          # pull request rewrites the firmware version in Cargo.toml and
          # Cargo.lock, so leaving it ungated means the gates never run on the
          # change most likely to break them, and the failure would surface
          # only after merge, against a published tag. Publishing the release
          # needs no workflow runs, so it uses the default token.
          token: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || secrets.GH_CI_TOKEN }}
          skip-github-pull-request: ${{ github.event_name == 'push' }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
