name: CI
on: [push, pull_request, workflow_dispatch]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      # The firmware pins esp-radio to a git revision (see firmware/Cargo.toml),
      # which costs roughly 190 MB of clones per run and makes a GitHub outage
      # enough to red an otherwise-good build. Caching the downloads removes
      # both.
      #
      # Only the authoritative copies are cached. `registry/src` and
      # `git/checkouts` are unpacked from `registry/cache` and `git/db`, so
      # caching them roughly doubles the size to store what cargo will happily
      # regenerate.
      #
      # Both lockfiles key it: firmware/ is its own cargo workspace with its own
      # lockfile, and a change to either should invalidate. `restore-keys` means
      # a lockfile bump still starts from the previous cache and fetches only
      # what actually changed, rather than everything.
      - name: Cache cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'firmware/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Each gate below is a justfile recipe, so `just check` locally runs
      # exactly what the pipeline runs. The steps stay separate only so a red
      # build names the gate that failed; why each gate exists is documented
      # beside its recipe in the justfile.

      - name: Format
        run: nix develop --command just fmt

      - name: Lint
        run: nix develop --command just lint

      - name: Test
        run: nix develop --command just test

      # The helper scripts parse what the firmware prints, so a reworded line
      # can break them without breaking a build.
      - name: Bench script self-tests
        run: nix develop --command just scripts

      - name: Cross-compile check
        run: nix develop --command just cross

      - name: Link check
        run: nix develop --command just link

      # Generation is byte-reproducible, which is what makes this a plain diff
      # rather than a fuzzy comparison.
      - name: Fixtures match their generator
        run: nix develop --command just fixtures

      # The password is baked in at build time (see firmware/src/main.rs), from
      # a secret rather than the repository. A fork or a PR without the secret
      # gets an empty value, which builds an image with no password: nothing
      # is unlocked until somebody types `pw`. Never echo it; workflow logs
      # are public.
      - name: Firmware builds and links
        env:
          TEDDIEBOX_SLIX_PASSWORD: ${{ secrets.TEDDIEBOX_SLIX_PASSWORD }}
        run: nix develop --command just firmware

      # The image without the `bench` console commands. Built here so this
      # configuration cannot stop compiling without anyone noticing.
      - name: Firmware builds without the bench commands
        env:
          TEDDIEBOX_SLIX_PASSWORD: ${{ secrets.TEDDIEBOX_SLIX_PASSWORD }}
        run: nix develop --command just firmware-release
