name: CI
# Pushes to main and pull requests: a branch with a pull request would
# otherwise be checked twice per commit, once for each event, and every run
# is billed. A branch without one can still be run from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository. The token is otherwise granted the
# repository's default scope, in a workflow that runs pull requests' code.
permissions:
  contents: read

# A newer push to a pull request makes a running check of the older one
# moot, so it is cancelled. Not on main: there every commit keeps its own verdict, so a
# red one can be pinned to the commit that caused it. That takes a group per
# commit, because a group also drops a queued run when a newer one arrives,
# whatever `cancel-in-progress` says.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # The gates are whatever `just check` depends on, read from the justfile, so
  # `just check` locally runs exactly what the pipeline runs and a gate cannot
  # be added to one without the other. Plain text parsing rather than `just
  # --dump`: this job would otherwise spend three minutes entering the Nix
  # shell to produce a list.
  gates:
    runs-on: ubuntu-latest
    outputs:
      gates: ${{ steps.read.outputs.gates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          gates="$(sed -n 's/^check: *//p' justfile | jq -Rce 'split(" ") | map(select(length > 0)) | select(length > 0)')"
          echo "gates=$gates" >> "$GITHUB_OUTPUT"

  # One job per gate, so a red build names the gate that failed and a slow gate
  # does not hold back the others. Why each gate exists is documented beside
  # its recipe in the justfile.
  check:
    needs: gates
    runs-on: ubuntu-latest
    strategy:
      # Report every failing gate, not only the first.
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.gates.outputs.gates) }}
    name: ${{ matrix.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      # The runner's disk filled up in a run that followed a nixpkgs bump: the
      # previous store, the new toolchain and the build cache together did
      # not fit. These preinstalled SDKs are nothing any gate uses, and
      # deleting them frees about 21 GB. It takes about two minutes, so it
      # runs in the background, alongside the cache restores below; the free
      # space is logged again before the gate.
      - name: Make room on the runner
        run: |
          df -h /
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache >/dev/null 2>&1 &

      # Entering the dev shell from an empty store fetches the whole toolchain
      # from cache.nixos.org and GitHub, which took about three minutes in
      # every job before its gate could start. Every job enters the same
      # shell, so whichever job saves first stores what all of them need.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Before saving, drop every path the dev shell no longer needs, or
          # each flake bump would store the previous toolchain alongside the
          # new one. The shell's profile and the flake's ci-gc-roots, both
          # made in the gate step, keep what the next job needs.
          gc-max-store-size-linux: 0

      # The firmware pins esp-radio to a git revision (see firmware/Cargo.toml),
      # which costs roughly 190 MB of clones per run and makes a GitHub outage
      # enough to red an otherwise-good build. Caching the downloads removes
      # both.
      #
      # Only the authoritative copies are cached. `registry/src` and
      # `git/checkouts` are unpacked from `registry/cache` and `git/db`, so
      # caching them roughly doubles the size to store what cargo will happily
      # regenerate.
      #
      # Every workspace's lockfile keys it: firmware/, fuzz/ and the link check
      # are cargo workspaces of their own, and a change to any should
      # invalidate. `restore-keys` means a lockfile bump still starts from the
      # previous cache and fetches only what actually changed, rather than
      # everything.
      #
      # The gate is in the key because each gate downloads a different set of
      # crates, and a cache is saved only by the first job to finish with its
      # key: a shared key would usually be saved by the quickest job, which
      # downloads the least.
      - name: Cache cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ matrix.gate }}-${{ hashFiles('Cargo.lock', 'firmware/Cargo.lock', 'fuzz/Cargo.lock', 'tools/xtensa-linkcheck/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.gate }}-

      # What each gate compiled, so a run rebuilds only this repository's
      # crates rather than every dependency; the lint gate alone spent about
      # four and a half minutes compiling from nothing. Between 0.2 and
      # 1.3 GB per gate.
      #
      # firmware/vendor comes along because its crates are path dependencies,
      # which cargo judges by modification time: re-vendored each run, they
      # would rebuild MbedTLS every time. Each vendor script's stamp still
      # re-vendors a copy its patches no longer match.
      #
      # No fallback to an older key: a cache is never overwritten, so an old
      # one grown by every dependency bump would only get bigger. A change to
      # a lockfile or the toolchain costs one cold build.
      - name: Cache build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            firmware/target
            firmware/vendor
            fuzz/target
            tools/xtensa-linkcheck/target
          key: target-${{ runner.os }}-${{ matrix.gate }}-${{ hashFiles('Cargo.lock', 'firmware/Cargo.lock', 'fuzz/Cargo.lock', 'tools/xtensa-linkcheck/Cargo.lock', 'flake.lock', 'scripts/vendor-*.sh') }}

      # The password is baked in at build time (see firmware/src/nfc.rs), from
      # a secret rather than the repository, and only the `images` gate
      # builds an image. A fork or a PR without the secret gets an empty value,
      # which builds an image with no password: nothing is unlocked until
      # somebody types `pw`. Never echo it; workflow logs are public.
      - name: just ${{ matrix.gate }}
        env:
          # Incremental state speeds up rebuilding the same crate while it
          # is edited, which a CI run never does, and would double what the
          # build cache stores.
          CARGO_INCREMENTAL: "0"
          TEDDIEBOX_SLIX_PASSWORD: ${{ matrix.gate == 'images' && secrets.TEDDIEBOX_SLIX_PASSWORD || '' }}
        run: |
          df -h /
          nix build .#ci-gc-roots --out-link "$RUNNER_TEMP/ci-gc-roots"
          nix develop --profile "$RUNNER_TEMP/dev-shell" --command just ${{ matrix.gate }}

  # The one check the branch rules on main require. They name checks, and the
  # gate jobs are named after whatever `check:` lists, so requiring them one
  # by one would quietly stop requiring a gate added later. This passes only
  # when every gate job did; a failed or skipped one fails it.
  all-gates:
    name: all gates
    needs: [gates, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GATES: ${{ needs.gates.result }}
          CHECK: ${{ needs.check.result }}
        run: '[ "$GATES" = success ] && [ "$CHECK" = success ]'
