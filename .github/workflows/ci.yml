name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: Format
        run: nix develop --command cargo fmt --all --check

      - name: Lint
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: nix develop --command cargo test --workspace

      # Proves the library crates are genuinely no_std, against the target
      # the firmware actually runs on rather than a bare-metal stand-in.
      # rustc ships no prebuilt core for xtensa, so core is built from source.
      - name: Cross-compile check
        run: nix develop --command cargo check -p teddiebox-taf --target xtensa-esp32s3-none-elf -Z build-std=core

      # Catches an FFI mismatch or a libopus dependency the device's C
      # library cannot satisfy — neither of which a host test or a
      # cross-compile check can see.
      - name: Link check
        run: nix develop --command ./scripts/xtensa-link-check.sh

      # Every format claim the parser is built on rests on these committed
      # fixtures, so a generator that has drifted from them quietly
      # invalidates the evidence. Generation is byte-reproducible, which is
      # what makes this a plain diff rather than a fuzzy comparison.
      - name: Fixtures match their generator
        run: |
          out="$(mktemp -d)"
          nix develop --command cargo run -q -p fixturegen -- "$out/sine.taf"
          diff "$out/sine.taf" crates/teddiebox-taf/tests/data/sine.taf
          diff "$out/chapters.taf" crates/teddiebox-taf/tests/data/chapters.taf
