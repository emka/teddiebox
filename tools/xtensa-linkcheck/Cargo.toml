[package]
name = "xtensa-linkcheck"
version = "0.1.0"
edition = "2021"
publish = false

# A separate workspace: this crate only builds for the device. A no_std
# staticlib with its own panic handler cannot be built for the host by
# `cargo test --workspace`.
[workspace]

[lib]
crate-type = ["staticlib"]
test = false

[dependencies]
teddiebox-audio = { path = "../../crates/teddiebox-audio" }
teddiebox-taf = { path = "../../crates/teddiebox-taf" }

[profile.release]
# No unwinder on the device, and nothing here should need one.
panic = "abort"
