[build]
target = "xtensa-esp32s3-none-elf"

# Without these two link arguments, linking fails with undefined interrupt
# symbols such as CORE0_DRAM0_PMS.
[target.xtensa-esp32s3-none-elf]
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Wl,-Tlinkall.x",
]

[unstable]
build-std = ["core", "alloc"]

# Where `esp-bootloader-esp-idf` reads the partition table. The stock
# bootloader is built for 0x9000, and partitions.csv puts the table there.
[env]
ESP_BOOTLOADER_ESP_IDF_CONFIG_PARTITION_TABLE_OFFSET = "0x9000"
