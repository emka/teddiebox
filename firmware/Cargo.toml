[package]
name = "teddiebox-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Its own workspace: the device dependency tree is pinned to release
# candidates and must not reach the host lockfile.
[workspace]

[dependencies]
teddiebox-core = { path = "../crates/teddiebox-core" }
lis3dh = { path = "../crates/lis3dh" }
tlv320dac3100 = { path = "../crates/tlv320dac3100" }
esp-hal = { version = "1.2.0-rc.0", features = ["esp32s3", "unstable", "rt"] }
# `esp-radio` turns on the esp-radio-rtos-driver integration: without it the
# radio stack has no scheduler to run its worker threads on. `esp-alloc` hands
# those allocations to the same heap the radio uses.
esp-rtos = { version = "0.4", features = [
    "esp32s3",
    "embassy",
    "esp-radio",
    "esp-alloc",
] }
# No features: esp-rtos provides the executor. Enabling arch-* or a task
# arena here breaks the build.
embassy-executor = "0.10"
embassy-time = "0.5"
# Guards the bench-typed credentials shared between the console loop and the
# radio task. Already in the tree under esp-hal; named here because this crate
# reaches for it directly.
critical-section = "1"
# Pinned to the same 0.8 the workspace crates use: `teddiebox_config::Config`
# is built from these strings, and a different heapless major would make
# `String<32>` a different type.
heapless = { version = "0.8", default-features = false }
# default-features off: the default `auto` feature picks USB Serial/JTAG
# over UART0 once a USB host has been seen, and GPIO19 (USB D-) is wired as
# the red LED here. The design specifies UART0 unconditionally, so `uart`
# is selected explicitly instead. `critical-section` is kept (esp-println
# needs a lock to print from more than one task); `colors` is dropped along
# with the rest of default — it only adds ANSI escapes to the output and a
# bench UART session doesn't need them.
esp-println = { version = "0.18", default-features = false, features = [
    "esp32s3",
    "uart",
    "critical-section",
] }
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
embedded-sdmmc = { version = "0.10", default-features = false }

# TLS, because the teddyCloud on this LAN speaks TLS 1.2 and nothing else.
# `embedded-tls` is TLS 1.3 only and cannot reach it at all; this crate (once
# `esp-mbedtls`) is published, carries no `esp-hal` dependency, and speaks the
# same `embedded-io-async` 0.7 that `embassy-net` and `teddiebox-cloud` already
# do, so it drops between them without an adapter.
#
# The features are cut to the one handshake this server offers —
# ECDHE-RSA-AES256-GCM-SHA384 over secp256r1, TLS 1.2 — because everything
# named here is C that has to fit in flash beside the decoder. No TLS 1.3, no
# server side, no other curve or key exchange. Hardware acceleration is on by
# default; the `nohook-*` features would turn it off.
#
# The content lengths are the reason this is worth reviewing: they size
# mbedtls's record buffers, which come from the same heap that was carved out
# of the decoder's stack. 16384 is the default and does not fit here.
mbedtls-rs = { version = "0.2", default-features = false, features = [
    # Build the C with the Xtensa GCC the flake already provides for libopus;
    # the default is clang, which this shell does not carry.
    "use-gcc",
    "tls-core",
    "tls-client",
    "tls-proto-tls12",
    "kex-ecdhe-rsa",
    "curve-secp256r1",
    "alg-aes",
    "alg-gcm",
    "alg-ecdh",
    "alg-ecp",
    "alg-rsa",
    "alg-sha256",
    "alg-sha512",
    "x509-parse",
    "pem-parse",
    "pk",
    "entropy",
    "drbg-ctr",
    "ssl-in-content-len-8192",
    "ssl-out-content-len-2048",
] }
static_cell = "2"
rand_core = { version = "0.10", default-features = false }
embedded-io-async = "0.7"
embedded-hal = { version = "1.0" }
embedded-hal-bus = { version = "0.3", default-features = false }
embassy-futures = "0.1"
teddiebox-audio = { version = "0.1.0", path = "../crates/teddiebox-audio" }
teddiebox-taf = { version = "0.1.0", path = "../crates/teddiebox-taf" }
portable-atomic = "1.15.0"
trf7962a = { version = "0.1.0", path = "../crates/trf7962a" }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32s3", "wifi"] }
# The radio stack allocates; nothing else in this firmware does. See the heap
# comment in src/main.rs.
esp-alloc = "0.11"
embassy-net = { version = "0.9.1", features = [
    "dhcpv4",
    "dns",
    "proto-ipv4",
    "tcp",
    "medium-ethernet",
] }
teddiebox-config = { path = "../crates/teddiebox-config" }
teddiebox-cloud = { path = "../crates/teddiebox-cloud" }
teddiebox-download = { path = "../crates/teddiebox-download" }

# esp-radio is only published as 1.0.0-beta.0, which wants esp-hal ~1.1.0 and
# esp-radio-rtos-driver 0.3 — neither compatible with the esp-hal 1.2.0-rc.0
# this firmware is built and bench-tested on. The whole family lives in one
# repository, so it is taken from the commit that released esp-rtos 0.4.0:
# there esp-radio wants esp-hal ~1.2.0-rc.0 and the versions below are the
# ones already pinned here. They are patched rather than given `git` keys so
# that esp-radio's in-repo path dependency on esp-hal resolves to the same
# package as ours, instead of linking a second copy of the HAL.
#
# Drop this block once esp-radio 1.0.0-beta.1 publishes against esp-hal 1.2.
[patch.crates-io]
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "63e97be553f435f29171f7ae5f37a41ad737a75a" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", rev = "63e97be553f435f29171f7ae5f37a41ad737a75a" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", rev = "63e97be553f435f29171f7ae5f37a41ad737a75a" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", rev = "63e97be553f435f29171f7ae5f37a41ad737a75a" }
esp-rom-sys = { git = "https://github.com/esp-rs/esp-hal.git", rev = "63e97be553f435f29171f7ae5f37a41ad737a75a" }

[profile.release]
opt-level = "s"
