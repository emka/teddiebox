[package]
name = "teddiebox-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# A separate workspace: the device dependencies are pinned to release
# candidates and must not affect the host lockfile.
[workspace]

# The same unsafe-code lints as the root workspace's crates, which this
# workspace cannot inherit.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

# Listed for its features, not its code: see `esp-storage` below.
[package.metadata.cargo-machete]
ignored = ["esp-storage"]

[dependencies]
teddiebox-core = { path = "../crates/teddiebox-core" }
teddiebox-board = { path = "../crates/teddiebox-board" }
teddiebox-console = { path = "../crates/teddiebox-console" }
teddiebox-identity = { path = "../crates/teddiebox-identity" }
teddiebox-wifikey = { path = "../crates/teddiebox-wifikey" }
lis3dh = { path = "../crates/lis3dh" }
tlv320dac3100 = { path = "../crates/tlv320dac3100" }
esp-hal = { version = "1.2", features = ["esp32s3", "unstable", "rt"] }
# `esp-radio` enables the esp-radio-rtos-driver integration; without it the
# Wi-Fi stack has no scheduler for its threads. `esp-alloc` makes those
# allocations use the same heap as the Wi-Fi stack.
esp-rtos = { version = "0.4", features = [
    "esp32s3",
    "embassy",
    "esp-radio",
    "esp-alloc",
] }
# No features: esp-rtos provides the executor. Enabling arch-* or a task
# arena here breaks the build.
embassy-executor = "0.10"
embassy-time = "0.5"
# `Signal`, to pass the latest box reading to whichever task wants it,
# without a queue.
embassy-sync = "0.8"
# Protects the credentials typed at the console, shared between the console
# loop and the Wi-Fi task. Already used by esp-hal; listed because this crate
# uses it directly.
critical-section = "1"
# Default features off: the default `auto` feature picks USB Serial/JTAG
# over UART0 once a USB host is seen, but GPIO19 (USB D-) is the red LED on
# this board. So `uart` is selected explicitly. `critical-section` is kept
# (needed to print from more than one task); `colors` is dropped (it only
# adds ANSI escapes).
esp-println = { version = "0.18", default-features = false, features = [
    "esp32s3",
    "uart",
    "critical-section",
] }
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "println", "custom-halt"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
# Listed only to turn `critical-section` on. `esp-bootloader-esp-idf` pulls
# in `esp-storage` with default features off, which turns `critical-section`
# off.
#
# Without it, flash erase and write run with interrupts enabled. The ROM
# turns the cache off during them, so an interrupt handler in flash cannot
# be loaded, and neither can the fault handler: the box freezes silently and
# needs a power cycle.
#
# Cargo merges features across the dependency graph, so this applies to
# `esp-bootloader-esp-idf` too. Check with
# `cargo tree -i esp-storage -e features`.
esp-storage = { version = "0.10.0", features = ["critical-section"] }
embedded-sdmmc = { version = "0.10", default-features = false }

# TLS, because teddyCloud only speaks TLS 1.2. `embedded-tls` only supports
# TLS 1.3. This crate has no `esp-hal` dependency and uses the same
# `embedded-io-async` 0.7 as `embassy-net` and `teddiebox-cloud`, so no
# adapter is needed.
#
# The features describe the one handshake the server offers
# (ECDHE-RSA-AES256-GCM-SHA384 over secp256r1, TLS 1.2), because all of this
# is C code that must fit in flash next to the decoder. Hardware acceleration
# is on by default; the `nohook-*` features would turn it off.
#
# This list cannot remove anything: `mbedtls-rs` always enables `tls-core`,
# `tls-server` and `tls-proto-tls13` in `mbedtls-rs-sys`, so TLS 1.3, the
# server side and ECDHE-ECDSA are always compiled in. Removing them needs a
# change in the vendored crate (`scripts/vendor-mbedtls-rs-sys.sh` and
# `scripts/vendor-mbedtls-rs.sh`). The entries that actually change something
# are `use-gcc`, `esp32s3`, `kex-ecdhe-rsa`, `alg-rsa`, `alg-sha512` and the
# two content lengths; the rest are on anyway and listed as a record of what
# the box needs.
#
# The content lengths size mbedtls's record buffers, which use the heap.
# The default, 16384, does not fit: the handshake's RSA operation then runs
# out of heap. 8192 cannot receive a 16 KB record, so the box asks the server
# for smaller records; see `scripts/vendor-mbedtls-rs.sh`.
mbedtls-rs = { version = "0.3", default-features = false, features = [
    # Build the C with the Xtensa GCC the Nix flake provides for libopus; the
    # default is clang, which the dev shell does not include.
    "use-gcc",
    "esp32s3",
    "tls-core",
    "tls-client",
    "tls-proto-tls12",
    "kex-ecdhe-rsa",
    "curve-secp256r1",
    "alg-aes",
    "alg-gcm",
    "alg-ecdh",
    "alg-ecp",
    "alg-rsa",
    "alg-sha256",
    "alg-sha512",
    "x509-parse",
    "pem-parse",
    "pk",
    "entropy",
    "drbg-ctr",
    "ssl-in-content-len-8192",
    "ssl-out-content-len-2048",
] }
static_cell = "2"
rand_core = { version = "0.10", default-features = false }
embedded-io-async = "0.7"
embedded-hal = { version = "1.0" }
embedded-hal-bus = { version = "0.3", default-features = false }
embassy-futures = "0.1"
teddiebox-audio = { version = "0.1.0", path = "../crates/teddiebox-audio" }
teddiebox-taf = { version = "0.1.0", path = "../crates/teddiebox-taf" }
portable-atomic = "1.15.0"
trf7962a = { version = "0.1.0", path = "../crates/trf7962a" }
# "unstable": needed for `AccessPointConfig::with_max_connections` in
# esp-radio. It requires esp-hal's `unstable`, which is on above.
esp-radio = { version = "1.0.0-beta.1", features = ["esp32s3", "wifi", "unstable"] }
# Only the Wi-Fi stack allocates. See the heap comment in src/main.rs.
esp-alloc = "0.11"
embassy-net = { version = "0.9.1", features = [
    "dhcpv4",
    "dns",
    "proto-ipv4",
    "tcp",
    # For the setup portal's DHCP *server*: `dhcpv4` above is the client, and
    # smoltcp has no server, so the box answers DHCP itself over UDP.
    "udp",
    "medium-ethernet",
] }
teddiebox-config = { path = "../crates/teddiebox-config" }
teddiebox-cloud = { path = "../crates/teddiebox-cloud" }
teddiebox-download = { path = "../crates/teddiebox-download" }
teddiebox-portal = { path = "../crates/teddiebox-portal" }
# OTA decisions and flash sector bookkeeping.
teddiebox-ota = { path = "../crates/teddiebox-ota" }

[patch.crates-io]

# `mbedtls-rs-sys` always enables SNI through its `tls-core` feature, and
# teddyCloud picks a certificate this build cannot use whenever it receives
# one. The patch is the published crate with that define removed. It is created
# by `scripts/vendor-mbedtls-rs-sys.sh` (run by `just vendor`) rather than
# committed, to keep 8.8 MB of C out of git.
#
# `firmware/vendor/` is gitignored, so a fresh clone needs `just vendor` (or
# any `just` recipe that builds) before a plain `cargo build` works.
#
# Drop this line once mbedtls-rs-sys offers a switch for SNI.
mbedtls-rs-sys = { path = "vendor/mbedtls-rs-sys" }

# `mbedtls-rs` 0.3.0 never calls `mbedtls_ssl_conf_max_frag_len` and keeps
# `mbedtls_ssl_config` private, so the box cannot ask the server for smaller
# records. It must: the input buffer above cannot hold teddyCloud's 16 KB
# records, and cannot grow, because the handshake's RSA operation needs that
# heap. `scripts/vendor-mbedtls-rs.sh` adds the call and explains the
# measurements.
#
# Drop this line once mbedtls-rs exposes the setting
# (https://github.com/esp-rs/mbedtls-rs/pull/145) and `PrivateKey::warm`.
mbedtls-rs = { path = "vendor/mbedtls-rs" }

# smoltcp 0.13.1 pauses all ARP requests for a second after any ARP request,
# so looking up the gateway for DNS delayed looking up teddyCloud, adding
# 1.03 s to every first connection. `scripts/vendor-smoltcp.sh` applies
# `scripts/smoltcp-per-address-arp.patch`, which makes the pause per
# address. Drop this line once upstream smoltcp does the same:
# https://github.com/smoltcp-rs/smoltcp/issues/1209
smoltcp = { path = "vendor/smoltcp" }

[profile.release]
opt-level = "s"
