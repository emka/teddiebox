[package]
name = "teddiebox-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Its own workspace: the device dependency tree is pinned to release
# candidates and must not reach the host lockfile.
[workspace]

[dependencies]
teddiebox-core = { path = "../crates/teddiebox-core" }
teddiebox-board = { path = "../crates/teddiebox-board" }
teddiebox-console = { path = "../crates/teddiebox-console" }
teddiebox-identity = { path = "../crates/teddiebox-identity" }
teddiebox-wifikey = { path = "../crates/teddiebox-wifikey" }
lis3dh = { path = "../crates/lis3dh" }
tlv320dac3100 = { path = "../crates/tlv320dac3100" }
esp-hal = { version = "1.2.0-rc.0", features = ["esp32s3", "unstable", "rt"] }
# `esp-radio` turns on the esp-radio-rtos-driver integration: without it the
# radio stack has no scheduler to run its worker threads on. `esp-alloc` hands
# those allocations to the same heap the radio uses.
esp-rtos = { version = "0.4", features = [
    "esp32s3",
    "embassy",
    "esp-radio",
    "esp-alloc",
] }
# No features: esp-rtos provides the executor. Enabling arch-* or a task
# arena here breaks the build.
embassy-executor = "0.10"
embassy-time = "0.5"
# `Signal`, to hand the poll loop's latest plate reading to whichever task
# asks for it without a queue neither side can size.
embassy-sync = "0.8"
# Guards the bench-typed credentials shared between the console loop and the
# radio task. Already in the tree under esp-hal; named here because this crate
# reaches for it directly.
critical-section = "1"
# Pinned to the same 0.8 the workspace crates use: `teddiebox_config::Config`
# is built from these strings, and a different heapless major would make
# `String<32>` a different type.
heapless = { version = "0.8", default-features = false }
# default-features off: the default `auto` feature picks USB Serial/JTAG
# over UART0 once a USB host has been seen, and GPIO19 (USB D-) is wired as
# the red LED here. The design specifies UART0 unconditionally, so `uart`
# is selected explicitly instead. `critical-section` is kept (esp-println
# needs a lock to print from more than one task); `colors` is dropped along
# with the rest of default — it only adds ANSI escapes to the output and a
# bench UART session doesn't need them.
esp-println = { version = "0.18", default-features = false, features = [
    "esp32s3",
    "uart",
    "critical-section",
] }
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
# Named directly only to turn `critical-section` back on. `esp-storage` is
# already here underneath `esp-bootloader-esp-idf`, which declares it
# `default-features = false` — and `critical-section` is in esp-storage's
# default set, so it arrives *off*.
#
# With it off, `maybe_with_critical_section` compiles to a bare call and the
# ROM's erase and write run with interrupts live. The ROM turns the cache off
# to invalidate it, so the next timer interrupt whose handler lives in flash
# cannot be fetched — and neither can the fault handler. The box stops dead,
# silently, with the LED frozen mid-colour. Measured on 2026-09-16: the first
# `otaw` did exactly that and needed a power cycle.
#
# Cargo unifies features across the graph, so enabling it here enables it for
# the `esp-bootloader-esp-idf` path too. Verify with
# `cargo tree -i esp-storage -e features`, which is how its absence was found.
esp-storage = { version = "0.10.0", features = ["critical-section"] }
embedded-sdmmc = { version = "0.10", default-features = false }

# TLS, because the teddyCloud on this LAN speaks TLS 1.2 and nothing else.
# `embedded-tls` is TLS 1.3 only and cannot reach it at all; this crate (once
# `esp-mbedtls`) is published, carries no `esp-hal` dependency, and speaks the
# same `embedded-io-async` 0.7 that `embassy-net` and `teddiebox-cloud` already
# do, so it drops between them without an adapter.
#
# The features name the one handshake this server offers —
# ECDHE-RSA-AES256-GCM-SHA384 over secp256r1, TLS 1.2 — because everything
# named here is C that has to fit in flash beside the decoder. Hardware
# acceleration is on by default; the `nohook-*` features would turn it off.
#
# What this list cannot do is take anything away. `mbedtls-rs` names
# `tls-core`, `tls-server` and `tls-proto-tls13` in its own dependency on
# `mbedtls-rs-sys` rather than behind optional features, so TLS 1.3, the server
# side and ECDHE-ECDSA are compiled in whatever is written here — an earlier
# version of this comment claimed the opposite, and editing the list to act on
# that claim produces a build that changes nothing at all, quietly. A define
# has to be removed where the crate is materialised instead; both
# `scripts/vendor-mbedtls-rs-sys.sh` and `scripts/vendor-mbedtls-rs.sh` exist
# for exactly that. The entries that genuinely decide something here are
# `use-gcc`, `esp32s3`, `kex-ecdhe-rsa`, `alg-rsa`, `alg-sha512` and the two
# content lengths; the rest are already on, and are kept because the list is
# also the record of what this box needs.
#
# The content lengths are the reason this is worth reviewing: they size
# mbedtls's record buffers, which come from the same heap that was carved out
# of the decoder's stack. 16384 is the default and does not fit — measured: the
# handshake's RSA private operation then dies for want of heap. Nor can 8192 be
# left to face a 16 KB record, which is why the box asks for a smaller one; see
# `scripts/vendor-mbedtls-rs.sh` for both measurements.
mbedtls-rs = { version = "0.2", default-features = false, features = [
    # Build the C with the Xtensa GCC the flake already provides for libopus;
    # the default is clang, which this shell does not carry.
    "use-gcc",
    "esp32s3",
    "tls-core",
    "tls-client",
    "tls-proto-tls12",
    "kex-ecdhe-rsa",
    "curve-secp256r1",
    "alg-aes",
    "alg-gcm",
    "alg-ecdh",
    "alg-ecp",
    "alg-rsa",
    "alg-sha256",
    "alg-sha512",
    "x509-parse",
    "pem-parse",
    "pk",
    "entropy",
    "drbg-ctr",
    "ssl-in-content-len-8192",
    "ssl-out-content-len-2048",
] }
static_cell = "2"
rand_core = { version = "0.10", default-features = false }
embedded-io-async = "0.7"
embedded-hal = { version = "1.0" }
embedded-hal-bus = { version = "0.3", default-features = false }
embassy-futures = "0.1"
teddiebox-audio = { version = "0.1.0", path = "../crates/teddiebox-audio" }
teddiebox-taf = { version = "0.1.0", path = "../crates/teddiebox-taf" }
portable-atomic = "1.15.0"
trf7962a = { version = "0.1.0", path = "../crates/trf7962a" }
# "unstable": `AccessPointConfig::with_max_connections` is gated behind it in
# the pinned esp-radio — `max_connections` carries `#[builder_lite(unstable)]`
# upstream, so the setter does not exist without this feature. esp-hal's own
# `unstable` is already on above, which is what `esp-radio/unstable` in turn
# requires.
esp-radio = { version = "1.0.0-beta.0", features = ["esp32s3", "wifi", "unstable"] }
# The radio stack allocates; nothing else in this firmware does. See the heap
# comment in src/main.rs.
esp-alloc = "0.11"
embassy-net = { version = "0.9.1", features = [
    "dhcpv4",
    "dns",
    "proto-ipv4",
    "tcp",
    # The setup portal's DHCP *server*. `dhcpv4` above is the client, and
    # smoltcp has no server, so the box answers leases itself over UDP.
    "udp",
    "medium-ethernet",
] }
teddiebox-config = { path = "../crates/teddiebox-config" }
teddiebox-cloud = { path = "../crates/teddiebox-cloud" }
teddiebox-download = { path = "../crates/teddiebox-download" }
teddiebox-portal = { path = "../crates/teddiebox-portal" }
# The OTA decisions and the flash sector bookkeeping. Brought in for the
# bench spikes so they drive the shipping arithmetic rather than a parallel
# copy written for the bench; the firmware half will want it regardless.
teddiebox-ota = { path = "../crates/teddiebox-ota" }

# esp-radio is only published as 1.0.0-beta.0, which wants esp-hal ~1.1.0 and
# esp-radio-rtos-driver 0.3 — neither compatible with the esp-hal 1.2.0-rc.0
# this firmware is built and bench-tested on. The whole family lives in one
# repository, so it is taken from the commit that released esp-rtos 0.4.0:
# there esp-radio wants esp-hal ~1.2.0-rc.0 and the versions below are the
# ones already pinned here. They are patched rather than given `git` keys so
# that esp-radio's in-repo path dependency on esp-hal resolves to the same
# package as ours, instead of linking a second copy of the HAL.
#
# Drop this block once esp-radio 1.0.0-beta.1 publishes against esp-hal 1.2.
[patch.crates-io]
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "63e97be553f435f29171f7ae5f37a41ad737a75a" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", rev = "63e97be553f435f29171f7ae5f37a41ad737a75a" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", rev = "63e97be553f435f29171f7ae5f37a41ad737a75a" }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", rev = "63e97be553f435f29171f7ae5f37a41ad737a75a" }
esp-rom-sys = { git = "https://github.com/esp-rs/esp-hal.git", rev = "63e97be553f435f29171f7ae5f37a41ad737a75a" }

# `mbedtls-rs-sys` 0.2.0 declares `esp-hal = "~1.1.0"`, which excludes the
# 1.2.0-rc.0 above, so the `esp32s3` feature — the whole of the hardware
# acceleration — cannot resolve against it. Nothing else is in the way: all
# nine `esp-hal` APIs the hooks use exist unchanged in 1.2. So the patch is the
# published crate with that one bound widened, materialised by
# `scripts/vendor-mbedtls-rs-sys.sh` (run by `just vendor`, which every gate
# that builds this crate depends on) rather than committed, because 8.8 MB of
# upstream C in the history is a lot to carry for eleven characters.
#
# `firmware/vendor/` is gitignored, so a fresh clone needs `just vendor` — or
# any `just` recipe that builds — before a bare `cargo build` will resolve.
#
# Drop this line once mbedtls-rs-sys widens the bound upstream.
mbedtls-rs-sys = { path = "vendor/mbedtls-rs-sys" }

# `mbedtls-rs` 0.2.0 never calls `mbedtls_ssl_conf_max_frag_len` and keeps the
# `mbedtls_ssl_config` private, so nothing downstream can tell the server how
# large a record this box can take. It has to be told: the input buffer above
# cannot hold CycloneSSL's 16 KB records, and cannot be grown to, because that
# heap is what the handshake's RSA private operation needs.
# `scripts/vendor-mbedtls-rs.sh` adds the one call, and explains the measurements.
#
# Drop this line once mbedtls-rs exposes the setting.
mbedtls-rs = { path = "vendor/mbedtls-rs" }

# smoltcp 0.13.1 silences its whole neighbor cache for a second after any ARP
# request, so resolving the gateway for DNS held back resolving teddyCloud on
# the same link: 1.03 s of every first connection. `scripts/vendor-smoltcp.sh`
# applies `scripts/smoltcp-per-address-arp.patch`, which makes the silence per
# address. Drop this line once upstream smoltcp does the same.
smoltcp = { path = "vendor/smoltcp" }

[profile.release]
opt-level = "s"
