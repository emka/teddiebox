[package]
name = "teddiebox-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
teddiebox-taf = { path = "../teddiebox-taf" }
# TAF audio is always 48 kHz stereo; without the "stereo" feature,
# opus-embedded's Decoder::new rejects Channels::Stereo at runtime.
opus-embedded = { version = "0.1", features = ["stereo"] }
