[package]
name = "teddiebox-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
teddiebox-taf = { path = "../teddiebox-taf" }
teddiebox-opus-sys = { path = "../teddiebox-opus-sys" }

[dev-dependencies]
# No plotting or rayon: the benchmark is run to read a number, and both add a
# lot of build time.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
