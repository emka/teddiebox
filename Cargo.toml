[workspace]
resolver = "2"
members = [
    "crates/teddiebox-audio",
    "crates/teddiebox-cloud",
    "crates/teddiebox-config",
    "crates/teddiebox-core",
    "crates/teddiebox-opus-sys",
    "crates/teddiebox-taf",
    "crates/tlv320dac3100",
    "crates/trf7962a",
    "tools/fixturegen",
    "tools/taf2wav",
]
# Device-only, and its own workspace: see its Cargo.toml.
exclude = ["tools/xtensa-linkcheck"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
heapless = { version = "0.8", default-features = false }
embedded-hal = "1.0"
embedded-hal-mock = { version = "0.11", features = ["eh1"] }
embedded-io = "0.6"
