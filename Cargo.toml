[workspace]
resolver = "2"
members = [
    "crates/lis3dh",
    "crates/teddiebox-audio",
    "crates/teddiebox-board",
    "crates/teddiebox-cloud",
    "crates/teddiebox-config",
    "crates/teddiebox-console",
    "crates/teddiebox-core",
    "crates/teddiebox-download",
    "crates/teddiebox-opus-sys",
    "crates/teddiebox-ota",
    "crates/teddiebox-portal",
    "crates/teddiebox-taf",
    "crates/tlv320dac3100",
    "crates/trf7962a",
    "tools/fat-assumptions",
    "tools/fixturegen",
    "tools/taf2wav",
]
# Device-only, and its own workspace: see its Cargo.toml.
exclude = ["tools/xtensa-linkcheck"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
heapless = { version = "0.8", default-features = false }
embedded-hal = "1.0"
embedded-hal-mock = { version = "0.11", features = ["eh1"] }
# A `block_on` for the driver tests: the reader's exchanges are async so that
# an empty plate cannot block the executor, and a host test still has to drive
# one to completion. no_std, one file, no executor.
embassy-futures = "0.1"
embedded-io = "0.7"
embedded-io-async = "0.7"
