[workspace]
resolver = "2"
members = [
    "crates/lis3dh",
    "crates/teddiebox-audio",
    "crates/teddiebox-board",
    "crates/teddiebox-cloud",
    "crates/teddiebox-config",
    "crates/teddiebox-console",
    "crates/teddiebox-core",
    "crates/teddiebox-download",
    "crates/teddiebox-identity",
    "crates/teddiebox-opus-sys",
    "crates/teddiebox-ota",
    "crates/teddiebox-portal",
    "crates/teddiebox-taf",
    "crates/teddiebox-wifikey",
    "crates/tlv320dac3100",
    "crates/trf7962a",
    "tools/fat-assumptions",
    "tools/identity-image",
    "tools/taf2wav",
]
# Device-only, and its own workspace: see its Cargo.toml.
exclude = ["tools/xtensa-linkcheck"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
heapless = { version = "0.8", default-features = false }
embedded-hal = "1.0"
embedded-hal-mock = { version = "0.11", features = ["eh1"] }
embedded-io = "0.7"
embedded-io-async = "0.7"
# Property tests. Without the fork and timeout features: the properties are
# plain functions of their input, and a test process forking is not.
proptest = { version = "1", default-features = false, features = ["std"] }

# Inherited by every crate under crates/, not by tools/, which are host
# programs rather than code that runs on the box.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
