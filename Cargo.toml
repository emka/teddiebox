[workspace]
resolver = "2"
members = [
    "crates/teddiebox-audio",
    "crates/teddiebox-opus-sys",
    "crates/teddiebox-taf",
    "tools/fixturegen",
    "tools/taf2wav",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
heapless = { version = "0.8", default-features = false }
